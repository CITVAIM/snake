<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="stat">
        <span class="label">得分</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">最高</span>
        <span id="best" class="value">0</span>
      </div>
      <button id="pause-btn" class="icon-btn" title="暂停 / 继续">⏸</button>
      <button id="new-btn" class="icon-btn" title="重新开始">↻</button>
    </header>

    <div class="stage">
      <canvas id="canvas"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">贪吃蛇</h2>
        <p id="overlay-text">方向键 / WASD 转向，吃掉果实变长<br />手机可滑动屏幕</p>
        <button id="start-btn" class="btn">开始游戏</button>
      </div>
    </div>

    <div class="pad">
      <button class="dpad up" data-dir="up">▲</button>
      <button class="dpad left" data-dir="left">◀</button>
      <button class="dpad down" data-dir="down">▼</button>
      <button class="dpad right" data-dir="right">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
